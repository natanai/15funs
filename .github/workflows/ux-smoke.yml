name: UX smoke

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/ux-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'tests/**'
      - '.github/workflows/ux-smoke.yml'

permissions:
  contents: read

jobs:
  interaction-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/ux-smoke.mjs
